<!-- Supabase Auth template "Reset Password" (architecture §54).
     Subject: Restablece tu contraseña de Agentonic -->
<div style="font-family: Arial, sans-serif; font-size: 15px; line-height: 1.5; color: #1f2933; max-width: 520px">
  <h2 style="font-size: 20px; margin: 0 0 16px">Restablece tu contraseña</h2>
  <p>Recibimos una solicitud para elegir una contraseña nueva para tu cuenta de Agentonic.</p>
  <p style="margin: 24px 0">
    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery"
       style="background: #0f5b8c; color: #ffffff; padding: 10px 18px; border-radius: 8px; text-decoration: none; display: inline-block">
      Elegir una contraseña nueva
    </a>
  </p>
  <p>El enlace funciona una sola vez y vence pronto.</p>
  <p style="color: #616e7c; font-size: 13px">Si no lo pediste, ignora este correo: tu contraseña no cambia.</p>
</div>
