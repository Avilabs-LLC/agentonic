name: Staging registrations
# Alerts when vm-agents-01 registrations are about to expire, failed re-verification,
# or the renewal job on the owner's Mac stopped reporting. Reads only the content-free
# STAGING_REGISTRATIONS repository variable; holds no database or VM credentials.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: staging-registrations
  cancel-in-progress: false
jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/staging-registrations
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types scripts/staging-registrations/alert.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_REGISTRATIONS: ${{ vars.STAGING_REGISTRATIONS }}
